timezone = "Europe/Stockholm"
brief_title = "Morning Brief"
report_directory = "reports"
state_directory = "state"

[schedule]
frequency = "daily"
local_time = "08:00"

[output]
format = "html"
report_format = "markdown"
latest_bookmarks = 5
top_x_threads = 12
top_github_projects = 8
top_custom_trending = 8
top_huggingface_papers = 5
include_links = true
include_action_items = true
save_report = true

[quality_gate]
max_total_items = 60
max_today_blocks = 10
hidden_signals = 3
follow_ups = 3

[sources.x_bookmarks]
enabled = true
access = "browser-authenticated-if-available"
max_items = 5

[sources.x_threads]
enabled = true
lookback_hours = 72
max_items = 40
topics = ["AI", "business", "startups"]
queries = [
  "AI startup thread",
  "AI business thread",
  "startup lessons thread",
  "agents AI thread",
  "AI product startups",
]

[sources.github_trending]
enabled = true
max_items = 25
topics = ["AI", "developer tools", "agents", "infrastructure", "data", "security", "startups"]

[sources.custom_trending]
enabled = true
max_items = 25
topics = ["AI", "developer tools", "agents", "infrastructure", "data", "security", "startups"]

[sources.huggingface_papers]
enabled = true
max_items = 20
topics = ["AI agents", "LLMs", "evaluation", "model infrastructure", "AI products"]

[sources.founder_signals]
enabled = true
subreddits = ["SaaS", "smallbusiness", "Entrepreneur", "SideProject", "LocalLLaMA", "indiehackers"]
lookback_hours = 72
max_demand = 6
max_revenue = 4
max_launches = 5

[sources.shipped]
enabled = true
lookback_hours = 72
max_items = 8
pinned_repos = ["anthropics/anthropic-sdk-python", "anthropics/claude-code", "openai/openai-python", "vercel/ai", "huggingface/transformers", "ollama/ollama"]

[sources.hidden_scouting]
enabled = true
max_items = 24
lookback_hours = 72
github_issue_queries = [
  "agent cost runaway",
  "stripe usage billing limits",
  "local llm benchmark mac",
  "claude code workflow blocked",
  "ai generated comments prompt leak",
]
github_issue_repos = [
  "anthropics/claude-code",
  "openai/openai-python",
  "vercel/ai",
  "huggingface/transformers",
  "ollama/ollama",
  "OpenHands/OpenHands",
  "langchain-ai/langchain",
  "browser-use/browser-use",
]
hn_comment_queries = [
  "AI created a problem",
  "agent costs",
  "Stripe event volume",
  "LLM local minima",
  "AI code review",
]
watch_pages = [
  "https://openai.com/api/pricing/",
  "https://docs.anthropic.com/en/docs/about-claude/models/overview",
  "https://vercel.com/docs/ai-sdk",
  "https://huggingface.co/models?sort=trending",
]

[[sources.shipped.feeds]]
name = "OpenAI"
url = "https://openai.com/news/rss.xml"

[[sources.shipped.feeds]]
name = "Anthropic"
# anthropic.com serves no RSS; RSSHub mirror of the news page
url = "https://rsshub.rssforever.com/anthropic/news"

[[sources.shipped.feeds]]
name = "Google AI"
url = "https://blog.google/technology/ai/rss/"

[[sources.shipped.feeds]]
name = "Meta AI"
# ai.meta.com/blog/rss is 404; the engineering AI-research feed is the working equivalent
url = "https://engineering.fb.com/category/ai-research/feed/"

[[sources.shipped.feeds]]
name = "Hugging Face"
url = "https://huggingface.co/blog/feed.xml"

[[sources.shipped.feeds]]
name = "DeepMind"
url = "https://deepmind.google/blog/rss.xml"
