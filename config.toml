timezone = "Europe/Stockholm"
brief_title = "Morning Brief"
report_directory = "reports"
state_directory = "state"

[schedule]
frequency = "daily"
local_time = "08:00"

[output]
format = "html"
latest_bookmarks = 20
top_x_threads = 80
top_github_projects = 50
top_custom_trending = 50
top_huggingface_papers = 50
include_links = true
include_action_items = true
save_report = true

[sources.x_bookmarks]
enabled = true
access = "browser-authenticated-if-available"
max_items = 20

[sources.x_threads]
enabled = true
lookback_hours = 72
max_items = 80
topics = ["AI", "business", "startups"]
queries = [
  "AI startup thread",
  "AI business thread",
  "startup lessons thread",
  "agents AI thread",
  "AI product startups",
]

[sources.github_trending]
enabled = true
max_items = 50
topics = ["AI", "developer tools", "agents", "infrastructure", "data", "security", "startups"]

[sources.custom_trending]
enabled = true
max_items = 50
topics = ["AI", "developer tools", "agents", "infrastructure", "data", "security", "startups"]

[sources.huggingface_papers]
enabled = true
max_items = 50
topics = ["AI agents", "LLMs", "evaluation", "model infrastructure", "AI products"]
